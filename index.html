<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa Astra</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; }

    #map {
      width: 100%;
      height: 100%;
    }

    .painel-filtros {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 50px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.96);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25);
      max-width: calc(100% - 90px);
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campo label {
      font-size: 11px;
      font-weight: 600;
      color: #3f4d5a;
    }

    .campo select {
      min-width: 180px;
      height: 34px;
      padding: 4px 8px;
      border: 1px solid #c7d1da;
      border-radius: 6px;
      background: white;
      color: #253746;
      font-size: 13px;
    }

    #status {
      position: absolute;
      z-index: 1000;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.96);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
      font-size: 13px;
      display: none;
      max-width: 80%;
      text-align: center;
    }

    @media (max-width: 700px) {
      .painel-filtros {
        left: 10px;
        right: 10px;
        max-width: none;
      }

      .campo {
        flex: 1 1 160px;
      }

      .campo select {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="painel-filtros">
    <div class="campo">
      <label for="estadoSelect">Estado</label>
      <select id="estadoSelect">
        <option value="">Selecione um estado</option>
      </select>
    </div>

    <div class="campo">
      <label for="municipioSelect">Município</label>
      <select id="municipioSelect" disabled>
        <option value="">Todos os municípios</option>
      </select>
    </div>
  </div>

  <div id="status"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([-14.2, -51.9], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const ESTADOS = [
      { nome: 'Acre', codigo: '12', sigla: 'AC' },
      { nome: 'Alagoas', codigo: '27', sigla: 'AL' },
      { nome: 'Amapá', codigo: '16', sigla: 'AP' },
      { nome: 'Amazonas', codigo: '13', sigla: 'AM' },
      { nome: 'Bahia', codigo: '29', sigla: 'BA' },
      { nome: 'Ceará', codigo: '23', sigla: 'CE' },
      { nome: 'Distrito Federal', codigo: '53', sigla: 'DF' },
      { nome: 'Espírito Santo', codigo: '32', sigla: 'ES' },
      { nome: 'Goiás', codigo: '52', sigla: 'GO' },
      { nome: 'Maranhão', codigo: '21', sigla: 'MA' },
      { nome: 'Mato Grosso', codigo: '51', sigla: 'MT' },
      { nome: 'Mato Grosso do Sul', codigo: '50', sigla: 'MS' },
      { nome: 'Minas Gerais', codigo: '31', sigla: 'MG' },
      { nome: 'Pará', codigo: '15', sigla: 'PA' },
      { nome: 'Paraíba', codigo: '25', sigla: 'PB' },
      { nome: 'Paraná', codigo: '41', sigla: 'PR' },
      { nome: 'Pernambuco', codigo: '26', sigla: 'PE' },
      { nome: 'Piauí', codigo: '22', sigla: 'PI' },
      { nome: 'Rio de Janeiro', codigo: '33', sigla: 'RJ' },
      { nome: 'Rio Grande do Norte', codigo: '24', sigla: 'RN' },
      { nome: 'Rio Grande do Sul', codigo: '43', sigla: 'RS' },
      { nome: 'Rondônia', codigo: '11', sigla: 'RO' },
      { nome: 'Roraima', codigo: '14', sigla: 'RR' },
      { nome: 'Santa Catarina', codigo: '42', sigla: 'SC' },
      { nome: 'São Paulo', codigo: '35', sigla: 'SP' },
      { nome: 'Sergipe', codigo: '28', sigla: 'SE' },
      { nome: 'Tocantins', codigo: '17', sigla: 'TO' }
    ];

    const estadoSelect = document.getElementById('estadoSelect');
    const municipioSelect = document.getElementById('municipioSelect');
    let geojsonAtual = null;
    let layerAtual = null;
    let estadoAtual = null;

    function normalizar(txt) {
      return (txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    function mostrarStatus(msg) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function ocultarStatus() {
      document.getElementById('status').style.display = 'none';
    }

    function encontrarEstado(valor) {
      if (!valor) return null;
      const alvo = normalizar(valor);
      return ESTADOS.find(e =>
        normalizar(e.nome) === alvo ||
        e.sigla.toLowerCase() === alvo
      ) || null;
    }

    function preencherEstados() {
      ESTADOS.forEach(e => {
        const option = document.createElement('option');
        option.value = e.nome;
        option.textContent = `${e.nome} (${e.sigla})`;
        estadoSelect.appendChild(option);
      });
    }

    function preencherMunicipios(features, municipioInicial = '') {
      municipioSelect.innerHTML = '<option value="">Todos os municípios</option>';

      const nomes = features
        .map(f => f.properties?.name)
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, 'pt-BR'));

      nomes.forEach(nome => {
        const option = document.createElement('option');
        option.value = nome;
        option.textContent = nome;
        municipioSelect.appendChild(option);
      });

      municipioSelect.disabled = false;

      if (municipioInicial) {
        const encontrado = nomes.find(n => normalizar(n) === normalizar(municipioInicial));
        if (encontrado) municipioSelect.value = encontrado;
      }
    }

    function atualizarURL() {
      const params = new URLSearchParams();
      if (estadoAtual) params.set('estado', estadoAtual.nome);
      if (municipioSelect.value) params.set('municipio', municipioSelect.value);

      const novaURL = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;

      window.history.replaceState({}, '', novaURL);
    }

    function desenharMapa(municipio = '') {
      if (!geojsonAtual || !estadoAtual) return;

      if (layerAtual) {
        map.removeLayer(layerAtual);
        layerAtual = null;
      }

      let features = geojsonAtual.features || [];

      if (municipio) {
        const alvo = normalizar(municipio);
        features = features.filter(f => normalizar(f.properties?.name) === alvo);
      }

      if (!features.length) {
        mostrarStatus(`Município "${municipio}" não encontrado em ${estadoAtual.nome}.`);
        return;
      }

      ocultarStatus();

      layerAtual = L.geoJSON({ type: 'FeatureCollection', features }, {
        style: {
          color: '#2f4858',
          weight: municipio ? 3 : 1.2,
          fillColor: '#7aa6c2',
          fillOpacity: 0.45
        },
        onEachFeature: (feature, lyr) => {
          const nome = feature.properties?.name || 'Município';
          const id = feature.properties?.id || '';
          lyr.bindPopup(`<strong>${nome}</strong><br>${estadoAtual.sigla}${id ? `<br>IBGE: ${id}` : ''}`);
        }
      }).addTo(map);

      map.fitBounds(layerAtual.getBounds(), {
        padding: [20, 20],
        maxZoom: municipio ? 11 : 8
      });

      atualizarURL();
    }

    async function carregarEstado(estado, municipioInicial = '') {
      estadoAtual = estado;
      municipioSelect.disabled = true;
      municipioSelect.innerHTML = '<option value="">Carregando...</option>';
      mostrarStatus(`Carregando municípios de ${estado.nome}...`);

      const geojsonURL = `https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-${estado.codigo}-mun.json`;

      try {
        const response = await fetch(geojsonURL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        geojsonAtual = await response.json();
        preencherMunicipios(geojsonAtual.features || [], municipioInicial);
        desenharMapa(municipioSelect.value);
      } catch (err) {
        console.error(err);
        mostrarStatus(`Erro ao carregar o GeoJSON de ${estado.nome}.`);
        municipioSelect.disabled = true;
      }
    }

    estadoSelect.addEventListener('change', async () => {
      const estado = encontrarEstado(estadoSelect.value);

      if (!estado) {
        estadoAtual = null;
        geojsonAtual = null;
        municipioSelect.disabled = true;
        municipioSelect.innerHTML = '<option value="">Todos os municípios</option>';
        if (layerAtual) map.removeLayer(layerAtual);
        map.setView([-14.2, -51.9], 4);
        atualizarURL();
        return;
      }

      await carregarEstado(estado);
    });

    municipioSelect.addEventListener('change', () => {
      desenharMapa(municipioSelect.value);
    });

    preencherEstados();

    const params = new URLSearchParams(window.location.search);
    const estadoInicial = encontrarEstado(params.get('estado'));
    const municipioInicial = params.get('municipio') || '';

    if (estadoInicial) {
      estadoSelect.value = estadoInicial.nome;
      carregarEstado(estadoInicial, municipioInicial);
    } else {
      ocultarStatus();
    }
  </script>
</body>
</html>
